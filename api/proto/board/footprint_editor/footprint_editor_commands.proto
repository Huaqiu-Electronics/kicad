syntax = "proto3";

package kiapi.footprint_editor.commands;

import "common/commands/import_part_option.proto";


message ImportFootprint 
{
  // URI to the .kicad_mod
  string uri = 1;

  // Create a new part or import the graphics into current part
  ImportPartOption import_part_option = 2;

}