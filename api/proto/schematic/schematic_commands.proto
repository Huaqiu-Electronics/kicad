syntax = "proto3";

package kiapi.schematic.commands;

import "common/types/design_resources.proto";


message PlaceDesignBlock
{
  // Contains at least one schematic and may contain a pcb
  kiapi.common.types.DesignBlockResource design_block_resource = 1;

  // Place the design block as a sheet symbol 
  optional bool place_as_sheet = 2;
}


message PlaceSymbol
{
  // Contains a symbol and one or more footprints, 3D models
  kiapi.common.types.ComponentResource component_resource = 1;
}