/*
 * design_resources.proto
 * Includes types used to access online or local resources
 */


syntax = "proto3";

package kiapi.common.types;

message SymbolResource
{
    string uri = 1;
}

// The 3D model resource
message ModelResource 
{
    string uri = 1;
}

message FootprintResource 
{
    string uri = 1;
    repeated ModelResource models = 2; // The 3D models for this footprint
}

message ComponentResource 
{
    SymbolResource symbol_resource = 1;
    repeated FootprintResource footprint_resources = 2;
}

message PCBResource 
{
    string pcb_uri = 1;
    repeated FootprintResource footprint_resources = 2;
}


message DesignBlockResource 
{
    repeated string schematic_uris = 1;
    optional string root_schematic = 2;
    optional PCBResource pcb_resource = 3;
    optional string version = 4;
}
