/*
 * design_resources.proto
 * Includes types used to access online or local resources
 */


syntax = "proto3";

package kiapi.common.types;

// URI can be a local path with a file:// prefix or a URL.
// https://en.wikipedia.org/wiki/Uniform_Resource_Identifier
// https://docs.wxwidgets.org/3.2/classwx_u_r_i.html

message SymbolResource
{
    // The URI to the .kicad_sym 
    string uri = 1;
}

// The 3D model resource
message ModelResource 
{
    // The URI of the 3D model resource (.step , .wrl ) 
    string uri = 1;
}

// May contain only the 3D models , e.g a block design has only a PCB
message FootprintResource 
{
    // The URI to the .kicad_mod
    optional string uri = 1;

    // The 3D models for this footprint
    repeated ModelResource models = 2; 
}


message ComponentResource 
{
    message Attribute{
        string name = 1;
        string value = 2;
    };

    // The name of the component, will be used as the symbol file name if presents
    // The name shall has no extension, e.g. "my_component" instead of "my_component.kicad_sym"
    optional string component_name = 1;

    // The symbol resource inside the component
    SymbolResource symbol_resource = 2;

    // The footprint resources associated with the symbol
    repeated FootprintResource footprint_resources = 3;

    // The attributes of the component, e.g. value, footprint, etc.
    repeated Attribute attributes = 4;

}

message PCBResource 
{
    // The URI to the .kicad_pcb
    string pcb_uri = 1;
    // The footprint and 3D model resources associated with the PCB
    repeated FootprintResource footprint_resources = 2;
}


// The design block resource may be also used to place a pcb for the pcb api
message DesignBlockResource 
{
    // The URIs of the .kicad_sch inside the design block
    repeated string schematic_uris = 1;

    // The root schematic name of the design block used in hierarchical design
    optional string root_schematic = 2;

    // The client may place the project footprints inside either the component_resources or the 
    // footprint_resources of the PCBResource (in case there is no schematic)
    repeated ComponentResource component_resources = 3;

    // The URI to the .kicad_pcb corresponding to the schematic(s)
    optional PCBResource pcb_resource = 4;

    // The version of the design block , meant to be used by online design block registries
    optional string version = 5;
}
